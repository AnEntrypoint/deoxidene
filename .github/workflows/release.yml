name: release

on:
  push:
    tags: ['v*.*.*']

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
            artifact: deoxidene-x64-linux
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
            artifact: deoxidene-arm64-linux
          - os: windows-latest
            preset: x64-windows-release
            artifact: deoxidene-x64-windows
          - os: windows-11-arm
            preset: arm64-windows-release
            artifact: deoxidene-arm64-windows
          - os: macos-13
            preset: x64-macos-release
            artifact: deoxidene-x64-macos
          - os: macos-latest
            preset: arm64-macos-release
            artifact: deoxidene-arm64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" || "$VCPKG_ROOT/bootstrap-vcpkg.bat"
        shell: bash
      - name: Configure + build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --install build/${{ matrix.preset }} --prefix out/${{ matrix.artifact }}
        shell: bash
      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz -C out ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  publish-release:
    needs: [build-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: find dist -name '*.tar.gz' -exec mv {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
