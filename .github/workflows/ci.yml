name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
          - os: windows-latest
            preset: x64-windows-release
          - os: windows-11-arm
            preset: arm64-windows-release
          - os: macos-13
            preset: x64-macos-release
          - os: macos-latest
            preset: arm64-macos-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" || "$VCPKG_ROOT/bootstrap-vcpkg.bat"
        shell: bash
      - name: Configure + build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }}
        shell: bash
      - name: Run example
        run: build/${{ matrix.preset }}/examples/hello/deoxidene_hello 7
        shell: bash

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build asan-ubsan
        run: |
          cmake --preset asan-ubsan
          cmake --build build/asan-ubsan
      - name: Run clean path (must pass)
        run: build/asan-ubsan/examples/hello/deoxidene_hello 7
      - name: Run injected-bug path (must be caught by ASan)
        run: |
          set +e
          build/asan-ubsan/examples/hello/deoxidene_hello --inject-bug
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "expected ASan to abort on injected bug, got clean exit"
            exit 1
          fi

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: Run clang-tidy
        run: clang-tidy -p build/debug include/deoxidene/*.hpp

  native-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build native-perf
        run: |
          cmake --preset native-perf
          cmake --build build/native-perf
      - name: Run example
        run: build/native-perf/examples/hello/deoxidene_hello 7
      - name: Run benchmark
        run: build/native-perf/bench/deoxidene_bench

